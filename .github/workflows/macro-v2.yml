name: Macro V2 Regression
on:
  push:
    branches: [feature/keymap-macro-v2]
    paths: ['src/**', 'include/**', 'tests/**', 'ci/apply-macro-v2.py', '.github/workflows/macro-v2.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macro-v2-core
  cancel-in-progress: false
jobs:
  regression:
    if: github.repository == 'gitlid/QtScrcpyCore' && github.ref == 'refs/heads/feature/keymap-macro-v2'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keymap-macro-v2
      - name: Apply checked source migration
        run: |
          if ! grep -q 'bool pause();' src/device/controller/actionmacro.h; then
            python3 ci/apply-macro-v2.py
          fi
          if ! grep -q 'add_executable(macroexecution_tests' tests/CMakeLists.txt; then
            cat >> tests/CMakeLists.txt <<'CMAKE'

          add_executable(macroexecution_tests macroexecution_test.cpp
              ${ROOT}/src/device/controller/actionmacro.cpp
              ${ROOT}/src/device/controller/actionmacro.h
              ${ROOT}/src/device/controller/bufferutil.cpp
              ${ROOT}/src/device/controller/inputconvert/controlmsg.cpp)
          target_include_directories(macroexecution_tests PRIVATE
              ${ROOT}/src/common ${ROOT}/src/device/android
              ${ROOT}/src/device/controller ${ROOT}/src/device/controller/inputconvert)
          target_link_libraries(macroexecution_tests PRIVATE Qt${QT_VERSION_MAJOR}::Core)
          foreach(case_name IN ITEMS speed_bounds speed_eight pause_wait pause_interval time_limit
              limit_during_interval limit_excludes_pause stop_paused touch_boundary key_boundary
              hid_pause_release recording_pause record_stop_paused geometry_paused pause_reentrancy busy_paused same_timestamp)
              add_test(NAME execution_${case_name} COMMAND macroexecution_tests ${case_name})
              set_tests_properties(execution_${case_name} PROPERTIES TIMEOUT 15)
          endforeach()
          CMAKE
          fi
      - name: Install Qt and build regression tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qtbase5-dev ninja-build
          cmake -S tests -B build-v2 -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined -no-pie'
          cmake --build build-v2 --parallel 2
      - name: Regression tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-v2 --output-on-failure --output-junit results.xml
      - name: Commit verified source changes only to feature branch
        run: |
          git add src include tests/CMakeLists.txt
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: implement tested 8x macro execution, pause/resume and duration limits'
            git push origin HEAD:refs/heads/feature/keymap-macro-v2
          fi
          git rev-parse HEAD | tee tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-v2-core-results
          path: |
            build-v2/Testing/Temporary/*.log
            build-v2/results.xml
            tested-commit.txt
