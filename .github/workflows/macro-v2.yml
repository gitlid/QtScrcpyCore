name: Macro V2 Regression
on:
  push:
    branches: [feature/keymap-macro-v2]
    paths: ['src/**', 'include/**', 'tests/**', '.github/workflows/macro-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macro-v2-core
  cancel-in-progress: true
jobs:
  regression:
    if: github.repository == 'gitlid/QtScrcpyCore' && github.ref == 'refs/heads/feature/keymap-macro-v2'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt and build committed regression sources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qtbase5-dev ninja-build
          cmake -S tests -B build-v2 -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined -no-pie'
          cmake --build build-v2 --parallel 2
      - name: Regression tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build-v2 --output-on-failure --output-junit results.xml
          git rev-parse HEAD > tested-commit.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-v2-core-results
          path: |
            build-v2/Testing/Temporary/*.log
            build-v2/results.xml
            tested-commit.txt
